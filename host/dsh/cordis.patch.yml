# Steward — long-lived engineering team for DeepSeek Harness.
#
# One Host row. The plugin registers, through DSH-native extension points:
#   - the `steward_dispatch` tool (one role per call, over ctx.subagents);
#   - the `/steward-roster` human command;
#   - the bundled Steward skills on ctx.skills.
#
# Two deliberate omissions:
#   * **No Agent Preset.** A preset is a user-selectable session mode, and a
#     specialist mode a human can switch into would bypass the plan gate,
#     baseline guard, QA and review that make Steward worth using. Every child
#     runs the shipped `standard` composition; the role charter is prepended to
#     the task prompt.
#   * **No Config and no browser half.** Per-role model routes live in the
#     project's `steward.config.json` (`modelRouting.<role>`), versioned with the
#     repository and checked by `scripts/validate-config.mjs` — not in a
#     per-machine settings namespace.
- insert:
    - id: steward
      name: dsh-steward

# Steward — long-lived engineering team for DeepSeek Harness.
#
# One Host row. The plugin registers, through DSH-native extension points:
#   - seven role Agent Presets (`steward-<role>`) via ctx.agentPresets, each a
#     persona + native tool composition;
#   - a native Settings section (`steward`, volatile Config fields) for per-role
#     subagent model and reasoning-effort routes;
#   - the `steward_dispatch` / `steward_config` tools and the `/steward` command;
#   - the bundled Steward skills on ctx.skills.
# The browser half (loaded from ./client) renders the Settings → Steward page
# over ctx.configForms, so this bundle serves no HTTP bridge.
- insert:
    - id: steward
      name: dsh-steward
